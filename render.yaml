services:
  - type: web
    name: supportiq-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: cd backend && pip install -r requirements-lock.txt && python -m ml.train_all
    startCommand: cd backend && python -m scripts.import_historical && python -m scripts.create_admin && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: supportiq-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://supportiq-lime.vercel.app
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"

databases:
  - name: supportiq-db
    plan: free
    region: oregon
    databaseName: supportiq
    user: supportiq
    ipAllowList: []
