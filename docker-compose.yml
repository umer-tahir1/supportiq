services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: supportiq
      POSTGRES_USER: supportiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportiq -d supportiq"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://supportiq:${POSTGRES_PASSWORD}@postgres:5432/supportiq
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      FRONTEND_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/saved_models:/app/saved_models
      - ./backend/data/processed:/app/data/processed
      - ./${DATASET_FILE:-311_Restaurant_data_20260930.csv}:/dataset.csv:ro
    ports:
      - "${API_PORT:-8000}:8000"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:${API_PORT:-8000}/api
    depends_on:
      - backend
    ports:
      - "5173:80"
volumes:
  postgres_data:
